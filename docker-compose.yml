services:
  backend:
    build: ./backend
    container_name: mikrotech_backend
    restart: unless-stopped
    env_file: stack.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      LAVALINK_URL: lavalink:2333
      CALLBACK_URL: ${CALLBACK_URL}
      API_PORT: 3000
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    networks:
      - mikrotech_net

  frontend:
    build: ./frontend
    container_name: mikrotech_frontend
    restart: unless-stopped
    env_file: stack.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT}
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT}:3001"
    depends_on:
      - backend
    networks:
      - mikrotech_net

  postgres:
    image: postgres:16-alpine
    container_name: mikrotech_postgres
    restart: unless-stopped
    env_file: stack.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mikrotech_v3}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mikrotech_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mikrotech_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mikrotech_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  lavalink:
    image: ghcr.io/performanc/nodelink:latest
    container_name: mikrotech_nodelink
    restart: unless-stopped
    env_file: stack.env
    environment:
      NODELINK_SERVER_HOST: 0.0.0.0
      NODELINK_SERVER_PORT: 2333
      NODELINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    ports:
      - "${LAVALINK_PORT:-2333}:2333"
    networks:
      - mikrotech_net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:2333/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  mikrotech_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  lavalink_plugins:

