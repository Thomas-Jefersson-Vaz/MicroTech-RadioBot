services:
  backend:
    build: ./backend
    container_name: mikrotech_backend
    restart: unless-stopped
    env_file: stack.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      LAVALINK_URL: lavalink:2333
      CALLBACK_URL: ${CALLBACK_URL}
      API_PORT: 3000
    ports:
      - "${API_PORT}:3000"
    depends_on:
      - postgres
      - redis
      - lavalink
    networks:
      - mikrotech_net

  frontend:
    build: ./frontend
    container_name: mikrotech_frontend
    restart: unless-stopped
    env_file: stack.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT}
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT}:3001"
    depends_on:
      - backend
    networks:
      - mikrotech_net

  postgres:
    image: postgres:16-alpine
    container_name: mikrotech_postgres
    restart: unless-stopped
    env_file: stack.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mikrotech_v3}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mikrotech_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mikrotech_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mikrotech_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: mikrotech_lavalink
    restart: unless-stopped
    env_file: stack.env
    environment:
      SERVER_PORT: 2333
      SERVER_ADDRESS: 0.0.0.0
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # Disabling built-in sources
      LAVALINK_SERVER_SOURCES_YOUTUBE: "false"
      LAVALINK_SERVER_SOURCES_BANDCAMP: "true"
      LAVALINK_SERVER_SOURCES_SOUNDCLOUD: "true"
      LAVALINK_SERVER_SOURCES_TWITCH: "true"
      LAVALINK_SERVER_SOURCES_VIMEO: "true"
      LAVALINK_SERVER_SOURCES_HTTP: "true"
      LAVALINK_SERVER_SOURCES_LOCAL: "false"
      # Audio Engine optimization settings
      LAVALINK_SERVER_BUFFER_DURATION_MS: 4000
      LAVALINK_SERVER_FRAME_BUFFER_DURATION_MS: 8000
      LAVALINK_SERVER_OPUS_ENCODING_QUALITY: 5
      LAVALINK_SERVER_RESAMPLING_QUALITY: MEDIUM
      LAVALINK_SERVER_TRACK_STUCK_THRESHOLD_MS: 10000
      LAVALINK_SERVER_USE_SEEK_GHOSTING: "true"
      LAVALINK_SERVER_YOUTUBE_PLAYLIST_LOAD_LIMIT: 15
      LAVALINK_SERVER_PLAYER_UPDATE_INTERVAL: 2
      LAVALINK_SERVER_YOUTUBE_SEARCH_ENABLED: "true"
      LAVALINK_SERVER_SOUNDCLOUD_SEARCH_ENABLED: "true"
      LAVALINK_SERVER_GC_WARNINGS: "false"
      # YouTube Plugin configuration
      LAVALINK_PLUGINS_0_DEPENDENCY: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      LAVALINK_PLUGINS_0_REPOSITORY: "https://maven.lavalink.dev/releases"
      # Plugin YouTube settings
      PLUGINS_YOUTUBE_ENABLED: "true"
      PLUGINS_YOUTUBE_ALLOWSEARCH: "true"
      PLUGINS_YOUTUBE_ALLOWDIRECTVIDEOIDS: "true"
      PLUGINS_YOUTUBE_ALLOWDIRECTPLAYLISTIDS: "true"
      PLUGINS_YOUTUBE_CLIENTS_0: "TVHTML5Embedded"
      PLUGINS_YOUTUBE_CLIENTS_1: "ANDROID_MUSIC"
      PLUGINS_YOUTUBE_CLIENTS_2: "ANDROID_VR"
    volumes:
      - lavalink_plugins:/opt/lavalink/plugins
    ports:
      - "${LAVALINK_PORT:-2333}:2333"
    networks:
      - mikrotech_net
    depends_on:
      - redis

networks:
  mikrotech_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  lavalink_plugins:

