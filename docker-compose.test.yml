services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: mikrotech_test
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  nodelink:
    build: ./infrastructure/nodelink
    environment:
      NODELINK_PASSWORD: integration
    ports: ["127.0.0.1:12339:2333"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:2333/version',{headers:{Authorization:process.env.NODELINK_PASSWORD}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      start_period: 30s
      retries: 30
