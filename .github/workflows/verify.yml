name: Verify migration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mikrotech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          LOG_LEVEL: ERROR
      - run: npm run test:integration
        working-directory: backend
        env:
          TEST_PG_URL: postgres://postgres:test@localhost:5432/mikrotech_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm run docs:commands -- --check
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:browser
        working-directory: frontend
      - run: docker build -t mikrotech-backend:test ./backend
      - run: docker build -t mikrotech-frontend:test ./frontend
      - run: docker build -t mikrotech-nodelink:test ./infrastructure/nodelink
      - run: |
          docker run -d --name mikrotech-audio-smoke -p 2333:2333 -e NODELINK_PASSWORD=test mikrotech-nodelink:test
          node backend/scripts/engine-smoke.js
        env:
          NODELINK_URL: localhost:2333
          NODELINK_PASSWORD: test
  publish:
    name: Publish multi-platform images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-main-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: IMAGE_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/mikrotech-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/mikrotech-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build and push NodeLink wrapper
        id: nodelink
        uses: docker/build-push-action@v6
        with:
          context: ./infrastructure/nodelink
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/mikrotech-nodelink:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=nodelink
          cache-to: type=gha,mode=max,scope=nodelink
      - name: Validate published platforms
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          NODELINK_DIGEST: ${{ steps.nodelink.outputs.digest }}
        run: |
          set -euo pipefail
          for component in backend frontend nodelink; do
            digest_var="${component^^}_DIGEST"
            image="$IMAGE_NAMESPACE/mikrotech-$component"
            digest="${!digest_var}"
            docker buildx imagetools inspect "$image@$digest" --raw | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] |
              (index("amd64") != null) and (index("arm64") != null)'
            printf '%s\n' "- $image:sha-$GITHUB_SHA — digest: $digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Promote validated images to latest
        id: promote
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          NODELINK_DIGEST: ${{ steps.nodelink.outputs.digest }}
        run: |
          set -euo pipefail
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; commit images published, latest left unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for component in backend frontend nodelink; do
            digest_var="${component^^}_DIGEST"
            image="$IMAGE_NAMESPACE/mikrotech-$component"
            docker buildx imagetools create --tag "$image:latest" "$image@${!digest_var}"
            echo "- Updated $image:latest" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'promoted=true' >> "$GITHUB_OUTPUT"
      - name: Deploy to Portainer
        if: steps.promote.outputs.promoted == 'true'
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; deployment webhook skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo '::error::Configure the PORTAINER_WEBHOOK_URL repository secret to enable deployment.'
            exit 1
          fi
          webhook_url=$(node -e 'const url = new URL(process.env.PORTAINER_WEBHOOK_URL); url.searchParams.set("pullimage", "true"); process.stdout.write(url.href);' 2>/dev/null) || {
            echo '::error::PORTAINER_WEBHOOK_URL is not a valid URL.'
            exit 1
          }
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --connect-timeout 10 --max-time 120 "$webhook_url"); then
            echo '::error::Portainer webhook request failed or timed out.'
            exit 1
          fi
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Portainer webhook returned HTTP $status; expected 2xx."
            exit 1
          fi
          echo 'Portainer accepted the deployment webhook. Deployment completion and application health must be checked in Portainer.' >> "$GITHUB_STEP_SUMMARY"
