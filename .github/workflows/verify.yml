name: Verify migration
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mikrotech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          LOG_LEVEL: ERROR
      - run: npm run test:integration
        working-directory: backend
        env:
          TEST_PG_URL: postgres://postgres:test@localhost:5432/mikrotech_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm run docs:commands -- --check
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:browser
        working-directory: frontend
      - run: docker build -t mikrotech-backend:test ./backend
      - run: docker build -t mikrotech-frontend:test ./frontend
      - run: docker build -t mikrotech-nodelink:test ./infrastructure/nodelink
      - run: |
          docker run -d --name mikrotech-audio-smoke -p 2333:2333 -e NODELINK_PASSWORD=test mikrotech-nodelink:test
          node backend/scripts/engine-smoke.js
        env:
          NODELINK_URL: localhost:2333
          NODELINK_PASSWORD: test
