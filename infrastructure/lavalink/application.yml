server: # REST and WS server
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false # Whether to enable HTTP/2 support
plugins:
  youtube:
    enabled: true # Whether this source can be used.
    allowSearch: true # Whether "ytsearch:" and "ytmsearch:" can be used.
    allowDirectVideoIds: true # Whether just video IDs can match. If false, only complete URLs will be loaded.
    allowDirectPlaylistIds: true # Whether just playlist IDs can match. If false, only complete URLs will be loaded.
    clients:
      - TVHTML5Embedded
      - ANDROID_MUSIC
      - ANDROID_VR
    # - ANDROID_TESTSUITE
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    # nas: enabled: true (Default)
    sources:
      youtube: false # Disabling built-in youtube to use the plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters: # All filters are enabled by default
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 4000 # 4s buffer for stability at higher quality
    frameBufferDurationMs: 8000 # Increased output buffer headroom
    opusEncodingQuality: 5 # Mid-range quality — balanced CPU vs audio fidelity
    resamplingQuality: MEDIUM # Better resampling without excessive CPU
    trackStuckThresholdMs: 10000 # Reset to default
    useSeekGhosting: true # Reset to default
    youtubePlaylistLoadLimit: 15 # Number of pages to load (~100 tracks/page)
    playerUpdateInterval: 2 # Faster updates for dashboard progress tracking
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: false
    # ratelimit:
      # ipBlocks: ["1.0.0.0/8", "..."] # list of ip blocks
      # excludedIps: ["...", "..."] # ips which should be explicit excluded from usage by lavalink
      # strategy: "RotateOnBan" # RotateOnBan | LoadBalance | NanoSwitch | RotatingNanoSwitch
      # searchTriggersFail: true # Whether a search 429 should trigger marking the ip as failing
      # retryLimit: -1 # -1 = use default lavalink retry limits
      # checkToken: "..." # api token for a valid header check.

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""
#  tags:
#    some_key: some_value
#    another_key: another_value

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000


